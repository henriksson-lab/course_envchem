<svg xmlns="http://www.w3.org/2000/svg" width="620" height="565" viewBox="0 0 620 565" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: the order of questions for reading any water analysis, as developed in this lecture. -->
  <rect x="10" y="10" width="600" height="82" rx="12" fill="#eef1f5"/><circle cx="50" cy="51" r="24" fill="#2468A0"/><text x="50" y="60" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="92" y="46" font-size="26" font-weight="bold" fill="#1b2a3a">What was measured?</text><text x="92" y="76" font-size="21" fill="#1b2a3a">total or species; filtered or whole</text><rect x="10" y="102" width="600" height="82" rx="12" fill="#e3efe6"/><circle cx="50" cy="143" r="24" fill="#2468A0"/><text x="50" y="152" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="92" y="138" font-size="26" font-weight="bold" fill="#1b2a3a">Convert to charge</text><text x="92" y="168" font-size="21" fill="#1b2a3a">mg/L → mmol/L → meq/L</text><rect x="10" y="194" width="600" height="82" rx="12" fill="#eef1f5"/><circle cx="50" cy="235" r="24" fill="#2468A0"/><text x="50" y="244" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="92" y="230" font-size="26" font-weight="bold" fill="#1b2a3a">Check the charge balance</text><text x="92" y="260" font-size="21" fill="#1b2a3a">do cation and anion charges match?</text><rect x="10" y="286" width="600" height="82" rx="12" fill="#e3efe6"/><circle cx="50" cy="327" r="24" fill="#2468A0"/><text x="50" y="336" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="92" y="322" font-size="26" font-weight="bold" fill="#1b2a3a">How salty is it?</text><text x="92" y="352" font-size="21" fill="#1b2a3a">ionic strength: is γ ≈ 1 acceptable?</text><rect x="10" y="378" width="600" height="82" rx="12" fill="#eef1f5"/><circle cx="50" cy="419" r="24" fill="#2468A0"/><text x="50" y="428" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="92" y="414" font-size="26" font-weight="bold" fill="#1b2a3a">Which form is present?</text><text x="92" y="444" font-size="21" fill="#1b2a3a">acid–base split at the measured pH</text><rect x="10" y="470" width="600" height="82" rx="12" fill="#e3efe6"/><circle cx="50" cy="511" r="24" fill="#2468A0"/><text x="50" y="520" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="92" y="506" font-size="26" font-weight="bold" fill="#1b2a3a">Favoured, but how fast?</text><text x="92" y="536" font-size="21" fill="#1b2a3a">redox state; equilibrium versus kinetics</text>
</svg>