<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: ionic atmosphere. In a crowded solution each ion is surrounded by a slight excess of opposite charge, which shields it, so it behaves as if less concentrated (activity coefficient below 1). Positions schematic. -->
  <defs>
    <g id="ca"><circle r="11" fill="#8e9aaf"/><text y="5" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">+</text></g>
    <g id="an"><circle r="11" fill="#d9b26f"/><text y="5" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold">−</text></g>
  </defs>
  <style>.b{font-size:23px;font-weight:bold;fill:#1b2a3a;text-anchor:middle} .t{font-size:19px;fill:#1b2a3a;text-anchor:middle}</style>
  <text class="b" x="225" y="32">Dilute: ions far apart</text>
  <rect x="25" y="50" width="400" height="300" rx="12" fill="#d6e6f2" opacity="0.6"/>
  <use href="#an" x="80" y="90"/>
  <use href="#ca" x="340" y="110"/>
  <use href="#an" x="300" y="300"/>
  <use href="#ca" x="70" y="290"/>
  <use href="#an" x="370" y="220"/>
  <circle cx="220" cy="200" r="20" fill="#2468A0"/><text x="220" y="207" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text class="t" x="225" y="385">each ion acts on its own: γ ≈ 1</text>
  <text class="b" x="670" y="32">Crowded: an ionic atmosphere</text>
  <rect x="470" y="50" width="400" height="300" rx="12" fill="#d6e6f2" opacity="0.6"/>
  <circle cx="670" cy="200" r="95" fill="#f6efe0" opacity="0.8"/>
  <use href="#an" x="675" y="251"/>
  <use href="#an" x="702" y="239"/>
  <use href="#ca" x="797" y="139"/>
  <use href="#an" x="690" y="295"/>
  <use href="#an" x="698" y="246"/>
  <use href="#ca" x="804" y="144"/>
  <use href="#an" x="692" y="142"/>
  <use href="#ca" x="574" y="116"/>
  <use href="#an" x="713" y="166"/>
  <use href="#an" x="618" y="118"/>
  <use href="#ca" x="612" y="208"/>
  <use href="#an" x="746" y="127"/>
  <use href="#ca" x="769" y="146"/>
  <use href="#an" x="734" y="124"/>
  <use href="#an" x="588" y="150"/>
  <use href="#an" x="620" y="318"/>
  <use href="#an" x="789" y="230"/>
  <use href="#an" x="567" y="181"/>
  <use href="#an" x="742" y="199"/>
  <use href="#an" x="707" y="302"/>
  <use href="#an" x="584" y="293"/>
  <use href="#an" x="522" y="152"/>
  <use href="#an" x="740" y="224"/>
  <use href="#an" x="612" y="157"/>
  <use href="#an" x="716" y="279"/>
  <use href="#ca" x="619" y="74"/>
  <use href="#an" x="654" y="60"/>
  <use href="#ca" x="630" y="337"/>
  <use href="#ca" x="532" y="274"/>
  <use href="#an" x="705" y="135"/>
  <use href="#an" x="609" y="219"/>
  <use href="#an" x="756" y="182"/>
  <use href="#an" x="736" y="216"/>
  <use href="#an" x="616" y="254"/>
  <use href="#an" x="769" y="190"/>
  <use href="#an" x="721" y="217"/>
  <use href="#an" x="641" y="150"/>
  <use href="#ca" x="592" y="204"/>
  <use href="#ca" x="751" y="266"/>
  <use href="#ca" x="528" y="277"/>
  <use href="#an" x="675" y="283"/>
  <use href="#ca" x="601" y="232"/>
  <use href="#an" x="723" y="119"/>
  <use href="#an" x="668" y="266"/>
  <use href="#an" x="688" y="330"/>
  <use href="#ca" x="823" y="243"/>
  <circle cx="670" cy="200" r="20" fill="#2468A0"/><text x="670" y="207" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">+</text>
  <text class="t" x="670" y="385">opposite charges shield the ion: γ &lt; 1</text>
</svg>