<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: wet flux from rain depth and concentration over one square metre. -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1b2a3a"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#AD4825"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2468A0"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#25713E"/></marker>
    <marker id="aro" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#b8860b"/></marker>
  </defs>
  <style>
    .t{font-size:24px;font-weight:bold;fill:#1b2a3a}
    .h{font-size:21px;font-weight:bold;fill:#1b2a3a;text-anchor:middle}
    .sp{font-size:26px;font-weight:bold;text-anchor:middle}
    .l{font-size:18px;fill:#1b2a3a}
    .lc{font-size:18px;fill:#1b2a3a;text-anchor:middle}
    .n{font-size:16px;fill:#6b7785;font-style:italic;text-anchor:middle}
    .ln{stroke:#1b2a3a;stroke-width:2.5;fill:none}
  </style>
  <path d="M120,330 L320,330 L390,280 L190,280 Z" fill="#cfe3c4" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M120,330 L120,170 L190,120 L190,280" fill="#9cc3e6" fill-opacity=".55" stroke="#2468A0" stroke-width="2"/>
  <path d="M120,170 L320,170 L320,330" fill="none" stroke="#2468A0" stroke-width="2"/>
  <path d="M320,170 L390,120 L390,280" fill="none" stroke="#2468A0" stroke-width="2"/>
  <path d="M120,170 L190,120 L390,120 L320,170 Z" fill="#d6e6f2" stroke="#2468A0" stroke-width="2"/>
  <rect x="120" y="170" width="200" height="160" fill="#9cc3e6" fill-opacity=".45"/>
  <text class="lc" x="220" y="365">1 m × 1 m of ground</text>
  <text x="400" y="215" font-size="18" fill="#2468A0">0.600 m of rain</text>
  <text x="400" y="240" font-size="18" fill="#2468A0">in one year</text>
  <rect x="560" y="60" width="400" height="270" rx="14" fill="#f6efe0" stroke="#b8860b" stroke-width="2"/>
  <text class="h" x="760" y="95">Wet nitrate flux</text>
  <text class="lc" x="760" y="135">water: 0.600 m × 1 m² = 0.600 m³</text>
  <text class="lc" x="760" y="165">= 600 L per m² per year</text>
  <text class="lc" x="760" y="205">× 20.0 µmol/L nitrate</text>
  <text class="lc" x="760" y="235">= 12 000 µmol</text>
  <text class="h" x="760" y="280">= 0.0120 mol NO₃⁻ m⁻² yr⁻¹</text>
  <text class="n" x="760" y="315">an amount flux, not yet an acid flux</text>
  <text class="n" x="490" y="392">1 mm of rain on 1 m² is exactly 1 L.</text>
</svg>
