<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: size continuum from dissolved ions to sand; the 0.45 um filter is an operational cut -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2468A0"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#25713E"/></marker>
  </defs>
  <rect x="188.57142857142856" y="150" width="385.71428571428567" height="60" rx="0" fill="#f6efe0" stroke="none" stroke-width="2"/>
  <line x1="60" y1="210" x2="960" y2="210" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="60.0" y1="204" x2="60.0" y2="216" stroke="#1b2a3a" stroke-width="2"/>
  <text x="60.0" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >0.1 nm</text>
  <line x1="188.57142857142856" y1="204" x2="188.57142857142856" y2="216" stroke="#1b2a3a" stroke-width="2"/>
  <text x="188.57142857142856" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >1 nm</text>
  <line x1="317.1428571428571" y1="204" x2="317.1428571428571" y2="216" stroke="#1b2a3a" stroke-width="2"/>
  <text x="317.1428571428571" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >10 nm</text>
  <line x1="445.71428571428567" y1="204" x2="445.71428571428567" y2="216" stroke="#1b2a3a" stroke-width="2"/>
  <text x="445.71428571428567" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >100 nm</text>
  <line x1="574.2857142857142" y1="204" x2="574.2857142857142" y2="216" stroke="#1b2a3a" stroke-width="2"/>
  <text x="574.2857142857142" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >1 µm</text>
  <line x1="702.8571428571429" y1="204" x2="702.8571428571429" y2="216" stroke="#1b2a3a" stroke-width="2"/>
  <text x="702.8571428571429" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >10 µm</text>
  <line x1="831.4285714285713" y1="204" x2="831.4285714285713" y2="216" stroke="#1b2a3a" stroke-width="2"/>
  <text x="831.4285714285713" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >100 µm</text>
  <line x1="960.0" y1="204" x2="960.0" y2="216" stroke="#1b2a3a" stroke-width="2"/>
  <text x="960.0" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >1 mm</text>
  <text x="381.42857142857144" y="180" font-size="20" fill="#b8860b" text-anchor="middle" font-weight="bold" >COLLOIDS</text>
  <text x="111.42857142857147" y="180" font-size="18" fill="#2468A0" text-anchor="middle" font-weight="bold" >dissolved</text>
  <text x="767.1428571428571" y="180" font-size="18" fill="#8a5a2b" text-anchor="middle" font-weight="bold" >particles</text>
  <line x1="529.2857142857143" y1="60" x2="529.2857142857143" y2="290" stroke="#c0392b" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="537.2857142857143" y="285" font-size="16" fill="#c0392b" text-anchor="start" font-weight="bold" >0.45 µm filter</text>
  <text x="537.2857142857143" y="305.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal" >"dissolved" ←  → "particulate"</text>
  <circle cx="85.71428571428562" cy="53" r="5.0" fill="#2468A0" stroke="none" stroke-width="2"/>
  <text x="99.71428571428562" y="57" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="normal" >ions,</text>
  <text x="99.71428571428562" y="75" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal" >Cu²⁺, PO₄³⁻</text>
  <circle cx="201.4285714285714" cy="88" r="6.6" fill="#b8860b" stroke="none" stroke-width="2"/>
  <text x="216.4285714285714" y="92" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="normal" >humic</text>
  <text x="216.4285714285714" y="110" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal" >molecules</text>
  <circle cx="291.4285714285715" cy="53" r="8.2" fill="#b8860b" stroke="none" stroke-width="2"/>
  <text x="307.4285714285715" y="57" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="normal" >Fe-oxide</text>
  <text x="307.4285714285715" y="75" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal" >nanoparticles</text>
  <circle cx="419.99999999999994" cy="88" r="9.8" fill="#b8860b" stroke="none" stroke-width="2"/>
  <text x="436.99999999999994" y="92" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="normal" >clay</text>
  <text x="436.99999999999994" y="110" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal" >platelets</text>
  <circle cx="574.2857142857142" cy="53" r="11.4" fill="#8a5a2b" stroke="none" stroke-width="2"/>
  <text x="592.2857142857142" y="57" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="normal" >bacteria</text>
  <text x="592.2857142857142" y="75" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal" ></text>
  <circle cx="702.8571428571429" cy="88" r="13.0" fill="#8a5a2b" stroke="none" stroke-width="2"/>
  <text x="721.8571428571429" y="92" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="normal" >silt</text>
  <text x="721.8571428571429" y="110" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal" ></text>
  <circle cx="870.0" cy="53" r="14.600000000000001" fill="#8a5a2b" stroke="none" stroke-width="2"/>
  <text x="890.0" y="57" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="normal" >fine sand</text>
  <text x="890.0" y="75" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal" ></text>
  <text x="60" y="330.0" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="normal" >Colloids are small enough to stay suspended, large enough to carry a lot of surface.</text>
</svg>
