project:
  type: website
  output-dir: docs
  resources:
    - demos/*.js
    - demos/demo.css
    - downloads/*.zip
    - aquatic-equilibria/water-ions.csv
    - aquatic-equilibria/corrections.csv
    - aquatic-equilibria/water-analysis.R
    - aquatic-equilibria/water-report.Rmd
    - carbonate-gases/speciation.R
    - carbonate-gases/report.Rmd
    - organic-contaminants/compounds.csv
    - organic-contaminants/fate.R
    - organic-contaminants/fate-report.Rmd
  render:
    - index.qmd
    - overview.qmd
    - glossary.qmd
    - "*/*.qmd"
    - "!templates/"
    - "!instructor/"
    - "!tools/"
    - "!demos/"

