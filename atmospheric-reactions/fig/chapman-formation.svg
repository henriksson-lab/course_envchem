<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: ozone formation. O2 photolysis, then O + O2 with a collision partner M. -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1b2a3a"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#AD4825"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2468A0"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#25713E"/></marker>
    <marker id="aro" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#b8860b"/></marker>
  </defs>
  <style>
    .t{font-size:24px;font-weight:bold;fill:#1b2a3a}
    .h{font-size:21px;font-weight:bold;fill:#1b2a3a;text-anchor:middle}
    .sp{font-size:26px;font-weight:bold;text-anchor:middle}
    .l{font-size:18px;fill:#1b2a3a}
    .lc{font-size:18px;fill:#1b2a3a;text-anchor:middle}
    .n{font-size:16px;fill:#6b7785;font-style:italic;text-anchor:middle}
    .ln{stroke:#1b2a3a;stroke-width:2.5;fill:none}
  </style>
  <text class="t" x="20" y="40">Step 1  Light splits O₂  (λ &lt; 240 nm)</text>
  <path d="M60,95 q12,-14 24,0 t24,0 t24,0 t24,0" fill="none" stroke="#6a4c93" stroke-width="3" marker-end="url(#ar)"/>
  <text x="90" y="80" font-size="17" fill="#6a4c93">photon</text>
  <text class="sp" x="185" y="105">+</text>
<circle cx="230" cy="98" r="17" fill="#c0392b"/><circle cx="260" cy="98" r="17" fill="#c0392b"/>
  <line class="ln" x1="300" y1="98" x2="380" y2="98" marker-end="url(#ar)"/>
<circle cx="420" cy="98" r="17" fill="#c0392b"/>  <text class="sp" x="470" y="105">+</text><circle cx="520" cy="98" r="17" fill="#c0392b"/>
  <text class="l" x="580" y="92">two free O atoms,</text><text class="l" x="580" y="116">very reactive</text>
  <text class="t" x="20" y="195">Step 2  O joins O₂; a third molecule M takes the extra energy</text>
<circle cx="60" cy="260" r="17" fill="#c0392b"/>  <text class="sp" x="100" y="268">+</text><circle cx="140" cy="260" r="17" fill="#c0392b"/><circle cx="170" cy="260" r="17" fill="#c0392b"/>
  <line class="ln" x1="200" y1="260" x2="262" y2="260" marker-end="url(#ar)"/>
  <circle cx="345" cy="260" r="58" fill="#f6efe0" stroke="#b8860b" stroke-dasharray="6 5" stroke-width="2"/>
<circle cx="317" cy="260" r="15" fill="#c0392b"/><circle cx="345" cy="260" r="15" fill="#c0392b"/><circle cx="373" cy="260" r="15" fill="#c0392b"/>
  <text class="lc" x="345" y="340">O₃* (energy-rich)</text>
  <text class="sp" x="430" y="268">+</text>
  <circle cx="480" cy="260" r="22" fill="#2468A0"/><text x="480" y="267" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold">M</text>
  <line class="ln" x1="520" y1="260" x2="600" y2="260" marker-end="url(#ar)"/>
<circle cx="625" cy="260" r="15" fill="#c0392b"/><circle cx="653" cy="260" r="15" fill="#c0392b"/><circle cx="681" cy="260" r="15" fill="#c0392b"/>
  <text class="lc" x="653" y="310">stable O₃</text>
  <text class="sp" x="715" y="268">+</text>
  <circle cx="760" cy="260" r="22" fill="#2468A0"/><text x="760" y="267" text-anchor="middle" font-size="20" fill="#fff" font-weight="bold">M</text>
  <text x="790" y="245" font-size="22" fill="#AD4825">~~ heat</text>
  <text class="lc" x="790" y="335">M is unchanged</text>
  <text class="n" x="490" y="385">M is usually N₂ or O₂. Without a collision partner, O₃* falls apart again.</text>
</svg>
