<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: two constructed waters with the same pH and different carbon inventories receive the same acid dose. -->
  <defs>
    <g id="hco3"><circle r="9" fill="#25713E"/></g>
    <g id="drop"><path d="M0,-16 C6,-6 10,0 10,6 A10,10 0 0 1 -10,6 C-10,0 -6,-6 0,-16 Z" fill="#c0392b"/></g>
  </defs>
  <style>
    .lab{font-size:24px;fill:#1b2a3a;font-weight:bold}
    .txt{font-size:19px;fill:#1b2a3a}
    .small{font-size:16px;fill:#6b7785}
    .acid{font-size:18px;fill:#c0392b;font-weight:bold}
  </style>

  <!-- Water A -->
  <g transform="translate(60,0)">
    <text class="lab" x="150" y="30" text-anchor="middle">Water A</text>
    <use href="#drop" x="150" y="78"/>
    <text class="acid" x="172" y="84">+ 0.050 mmol/L H⁺</text>
    <path d="M40,110 L40,370 Q40,392 62,392 L238,392 Q260,392 260,370 L260,110" fill="none" stroke="#1b2a3a" stroke-width="4"/>
    <rect x="44" y="160" width="212" height="228" fill="#d6e6f2"/>
    <line x1="44" y1="160" x2="256" y2="160" stroke="#2468A0" stroke-width="2"/>
    <g>
      <use href="#hco3" x="70" y="190"/><use href="#hco3" x="105" y="200"/><use href="#hco3" x="140" y="185"/><use href="#hco3" x="175" y="198"/><use href="#hco3" x="210" y="188"/><use href="#hco3" x="235" y="215"/>
      <use href="#hco3" x="65" y="235"/><use href="#hco3" x="100" y="245"/><use href="#hco3" x="135" y="230"/><use href="#hco3" x="170" y="242"/><use href="#hco3" x="205" y="236"/>
      <use href="#hco3" x="75" y="280"/><use href="#hco3" x="112" y="290"/><use href="#hco3" x="148" y="276"/><use href="#hco3" x="185" y="288"/><use href="#hco3" x="222" y="275"/>
      <use href="#hco3" x="68" y="325"/><use href="#hco3" x="104" y="335"/><use href="#hco3" x="140" y="320"/><use href="#hco3" x="178" y="332"/><use href="#hco3" x="215" y="322"/>
      <use href="#hco3" x="88" y="368"/><use href="#hco3" x="128" y="362"/><use href="#hco3" x="165" y="370"/><use href="#hco3" x="205" y="365"/>
    </g>
    <text class="txt" x="150" y="422" text-anchor="middle">pH 7.50 · C<tspan baseline-shift="sub" font-size="14">T</tspan> = 1.00 mmol/L</text>
  </g>

  <!-- Water B -->
  <g transform="translate(500,0)">
    <text class="lab" x="150" y="30" text-anchor="middle">Water B</text>
    <use href="#drop" x="150" y="78"/>
    <text class="acid" x="172" y="84">+ 0.050 mmol/L H⁺</text>
    <path d="M40,110 L40,370 Q40,392 62,392 L238,392 Q260,392 260,370 L260,110" fill="none" stroke="#1b2a3a" stroke-width="4"/>
    <rect x="44" y="160" width="212" height="228" fill="#d6e6f2"/>
    <line x1="44" y1="160" x2="256" y2="160" stroke="#2468A0" stroke-width="2"/>
    <use href="#hco3" x="110" y="250"/><use href="#hco3" x="190" y="320"/><use href="#hco3" x="140" y="355"/>
    <text class="txt" x="150" y="422" text-anchor="middle">pH 7.50 · C<tspan baseline-shift="sub" font-size="14">T</tspan> = 0.100 mmol/L</text>
  </g>

  <!-- key -->
  <use href="#hco3" x="420" y="210"/>
  <text class="small" x="430" y="240" text-anchor="middle">≈ dissolved</text>
  <text class="small" x="430" y="260" text-anchor="middle">inorganic</text>
  <text class="small" x="430" y="280" text-anchor="middle">carbon</text>
  <text x="430" y="170" text-anchor="middle" font-size="44" fill="#b8860b" font-weight="bold">?</text>
</svg>
