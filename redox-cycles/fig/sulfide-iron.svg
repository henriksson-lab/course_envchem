<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: sulfide binds iron as FeS, so less iron is left to trap phosphate when oxygen returns -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2468A0"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#25713E"/></marker>
  </defs>
  <rect x="20" y="30" width="300" height="270" rx="10" fill="#f4f6f8" stroke="#6c4f9c" stroke-width="2.5"/>
  <text x="170" y="65" font-size="21" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >Sulfate reduction</text>
  <circle cx="120" cy="150" r="26" fill="#e6c200" stroke="none" stroke-width="2"/>
  <text x="120" y="157" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >SO₄²⁻</text>
  <line x1="150" y1="150" x2="190" y2="150" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <circle cx="220" cy="150" r="22" fill="#6c4f9c" stroke="none" stroke-width="2"/>
  <text x="220" y="157" font-size="15" fill="white" text-anchor="middle" font-weight="bold" >HS⁻</text>
  <text x="170" y="245.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >SO₄²⁻ + 9H⁺ + 8e⁻ → HS⁻ + 4H₂O</text>
  <line x1="322" y1="165" x2="342" y2="165" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="345" y="30" width="300" height="270" rx="10" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="2.5"/>
  <text x="495" y="65" font-size="21" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >Iron sulfide forms</text>
  <rect x="405" y="140" width="22" height="22" rx="3" fill="#222" stroke="none" stroke-width="0"/>
  <rect x="431" y="154" width="22" height="22" rx="3" fill="#222" stroke="none" stroke-width="0"/>
  <rect x="457" y="140" width="22" height="22" rx="3" fill="#222" stroke="none" stroke-width="0"/>
  <rect x="483" y="154" width="22" height="22" rx="3" fill="#222" stroke="none" stroke-width="0"/>
  <rect x="509" y="140" width="22" height="22" rx="3" fill="#222" stroke="none" stroke-width="0"/>
  <rect x="535" y="154" width="22" height="22" rx="3" fill="#222" stroke="none" stroke-width="0"/>
  <rect x="561" y="140" width="22" height="22" rx="3" fill="#222" stroke="none" stroke-width="0"/>
  <text x="495" y="210" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >black FeS(s)</text>
  <text x="495" y="245.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >Fe²⁺ + HS⁻ → FeS(s) + H⁺</text>
  <line x1="647" y1="165" x2="667" y2="165" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="670" y="30" width="300" height="270" rx="10" fill="#f4f6f8" stroke="#c27c3a" stroke-width="2.5"/>
  <text x="820" y="65" font-size="21" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >O₂ returns</text>
  <rect x="730" y="150" width="180" height="20" rx="3" fill="#c27c3a" stroke="none" stroke-width="0"/>
  <text x="820" y="195" font-size="15" fill="#c27c3a" text-anchor="middle" font-weight="normal" >thin oxide layer</text>
  <path d="M750,175 L760,105" stroke="#b8860b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M815,175 L825,105" stroke="#b8860b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <path d="M880,175 L890,105" stroke="#b8860b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="820" y="245.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >less free iron to form Fe(III)</text>
  <text x="820" y="265.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >oxide; phosphate is not</text>
  <text x="820" y="285.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >recaptured</text>
</svg>
