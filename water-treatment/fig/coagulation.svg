  <circle cx="797" cy="168" r="6" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <circle cx="814" cy="173" r="6" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <path d="M805,192 L805,212" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
