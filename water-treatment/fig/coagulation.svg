  <circle cx="879" cy="233" r="6" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <path d="M870,252 L870,272" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <ellipse cx="935" cy="170" rx="26" ry="18" fill="#c27c3a" opacity="0.85"/>
  <circle cx="927" cy="168" r="6" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <circle cx="944" cy="173" r="6" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <path d="M935,192 L935,212" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="835" y="312" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >sludge</text>
  <text x="500" y="360" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >The coagulant does not destroy anything: it moves particles and itself into the sludge.</text>
</svg>
