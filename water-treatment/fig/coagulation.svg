  <text x="70" y="105" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="140" cy="100" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="140" y="105" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="210" cy="100" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="210" y="105" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="280" cy="100" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="280" y="105" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="70" cy="170" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="70" y="175" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="140" cy="170" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="140" y="175" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="210" cy="170" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="210" y="175" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="280" cy="170" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="280" y="175" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="70" cy="240" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="70" y="245" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="140" cy="240" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="140" y="245" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="210" cy="240" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="210" y="245" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <circle cx="280" cy="240" r="12" fill="#b59a6e" stroke="none" stroke-width="2"/>
  <text x="280" y="245" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <text x="175" y="300" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >same charge: they repel</text>
  <line x1="332" y1="170" x2="348" y2="170" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="350" y="20" width="310" height="300" rx="10" fill="#d6e6f2" stroke="none" stroke-width="0"/>
