  <text x="505" y="302" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >charge neutralised, H⁺ released</text>
  <line x1="662" y1="170" x2="678" y2="170" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="680" y="20" width="310" height="300" rx="10" fill="#d6e6f2" stroke="none" stroke-width="0"/>
