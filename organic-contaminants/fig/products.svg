<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: parent loss is not mineralisation. DDT loses HCl to form DDE, which is more persistent; PFAS precursors in foam transform to terminal perfluoroalkyl acids such as PFOS and PFOA, which do not degrade further. -->
  <defs>
    <marker id="ar" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6 L0,12 Z" fill="#1b2a3a"/></marker>
  </defs>
  <style>
    .b{font-size:20px;font-weight:bold;text-anchor:middle}
    .t{font-size:16px;fill:#1b2a3a;text-anchor:middle}
  </style>
  <rect x="30" y="30" width="220" height="90" rx="12" fill="#e9dcc3" stroke="#AD4825" stroke-width="2"/>
  <text class="b" x="140" y="70" fill="#1b2a3a">DDT</text><text class="t" x="140" y="96">insecticide (parent)</text>
  <line x1="255" y1="75" x2="430" y2="75" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
  <text class="t" x="342" y="64">− HCl</text>
  <rect x="440" y="30" width="220" height="90" rx="12" fill="#AD4825"/>
  <text class="b" x="550" y="70" fill="#fff">DDE</text><text x="550" y="96" font-size="16" fill="#fff" text-anchor="middle">product</text>
  <text x="680" y="68" font-size="16" fill="#1b2a3a">more persistent than DDT;</text>
  <text x="680" y="92" font-size="16" fill="#1b2a3a">linked to eggshell thinning</text>

  <rect x="30" y="170" width="220" height="90" rx="12" fill="#e9dcc3" stroke="#AD4825" stroke-width="2"/>
  <text class="b" x="140" y="210" fill="#1b2a3a">PFAS precursors</text><text class="t" x="140" y="236">in some foams (parent)</text>
  <line x1="255" y1="215" x2="430" y2="215" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
  <text class="t" x="342" y="204">microbes, oxidation</text>
  <rect x="440" y="170" width="220" height="90" rx="12" fill="#c0392b"/>
  <text class="b" x="550" y="210" fill="#fff">PFOS, PFOA …</text><text x="550" y="236" font-size="16" fill="#fff" text-anchor="middle">terminal products</text>
  <text x="680" y="208" font-size="16" fill="#1b2a3a">no further breakdown</text>
  <text x="680" y="232" font-size="16" fill="#1b2a3a">known in the environment</text>
  <text class="t" x="470" y="305"><tspan font-weight="bold">Parent "lost" can mean a new, sometimes worse, compound.</tspan> Mineralisation means CO₂, H₂O and ions.</text>
</svg>
