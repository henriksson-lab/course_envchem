<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" font-family="Helvetica, Arial, sans-serif">
  <!-- Structure: PFOS, a perfluorinated C8 chain with a sulfonate head group. Fluorinated tail: very strong C-F bonds, repels water and fat; head group: ionised at environmental pH. -->
  <style>
    .c{font-size:15px;font-weight:bold;fill:#fff;text-anchor:middle}
    .f{font-size:14px;fill:#2468A0;text-anchor:middle;font-weight:bold}
    .t{font-size:17px;fill:#1b2a3a}
  </style>
  <!-- zigzag chain -->
  <polyline points="70,150 140,120 210,150 280,120 350,150 420,120 490,150 560,120 640,150" stroke="#1b2a3a" stroke-width="4" fill="none"/>
  <g fill="#555">
    <circle cx="70" cy="150" r="20"/><circle cx="140" cy="120" r="20"/><circle cx="210" cy="150" r="20"/><circle cx="280" cy="120" r="20"/>
    <circle cx="350" cy="150" r="20"/><circle cx="420" cy="120" r="20"/><circle cx="490" cy="150" r="20"/><circle cx="560" cy="120" r="20"/>
  </g>
  <g class="c"><text x="70" y="155">C</text><text x="140" y="125">C</text><text x="210" y="155">C</text><text x="280" y="125">C</text><text x="350" y="155">C</text><text x="420" y="125">C</text><text x="490" y="155">C</text><text x="560" y="125">C</text></g>
  <!-- F atoms: up for upper C, down for lower C -->
  <g stroke="#2468A0" stroke-width="2">
    <line x1="140" y1="100" x2="140" y2="78"/><line x1="280" y1="100" x2="280" y2="78"/><line x1="420" y1="100" x2="420" y2="78"/><line x1="560" y1="100" x2="560" y2="78"/>
    <line x1="70" y1="170" x2="70" y2="192"/><line x1="210" y1="170" x2="210" y2="192"/><line x1="350" y1="170" x2="350" y2="192"/><line x1="490" y1="170" x2="490" y2="192"/>
    <line x1="50" y1="150" x2="32" y2="150"/>
  </g>
  <g class="f">
    <text x="140" y="72">F₂</text><text x="280" y="72">F₂</text><text x="420" y="72">F₂</text><text x="560" y="72">F₂</text>
    <text x="70" y="210">F₂</text><text x="210" y="210">F₂</text><text x="350" y="210">F₂</text><text x="490" y="210">F₂</text>
    <text x="22" y="155">F</text>
  </g>
  <!-- head group -->
  <circle cx="660" cy="150" r="34" fill="#c0392b"/>
  <text x="660" y="156" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">SO₃⁻</text>
  <!-- braces / labels -->
  <path d="M30,240 L30,250 L580,250 L580,240" fill="none" stroke="#2468A0" stroke-width="2.5"/>
  <text class="t" x="305" y="278" text-anchor="middle"><tspan font-weight="bold" fill="#2468A0">Perfluorinated tail:</tspan> C–F bonds among the strongest in</text>
  <text class="t" x="305" y="300" text-anchor="middle">organic chemistry. Microbes and sunlight barely break it.</text>
  <text class="t" x="305" y="322" text-anchor="middle">Repels both water and oil, so it collects at interfaces.</text>
  <text class="t" x="720" y="120" font-weight="bold" fill="#c0392b">Acid head group</text>
  <text class="t" x="720" y="145">strong acid: ionised</text>
  <text class="t" x="720" y="168">at environmental pH,</text>
  <text class="t" x="720" y="191">so it dissolves and moves</text>
  <text class="t" x="720" y="214">with groundwater</text>
  <text x="30" y="30" font-size="20" font-weight="bold" fill="#1b2a3a">PFOS (perfluorooctane sulfonate), C₈F₁₇SO₃⁻</text>
</svg>
