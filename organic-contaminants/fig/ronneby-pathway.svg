<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: pathway from firefighting-foam use at a training site, through sandy soil and groundwater, to a drinking-water well and consumers, annotated with the property that matters at each step. -->
  <defs>
    <marker id="ar" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6 L0,12 Z" fill="#c0392b"/></marker>
  </defs>
  <style>
    .t{font-size:16px;fill:#1b2a3a}
    .b{font-size:17px;font-weight:bold;fill:#1b2a3a}
  </style>
  <!-- ground layers -->
  <rect x="0" y="120" width="940" height="110" fill="#e3cf9f"/>
  <rect x="0" y="230" width="940" height="110" fill="#9cc3e0"/>
  <rect x="0" y="340" width="940" height="60" fill="#8c8c8c"/>
  <text x="400" y="145" font-size="15" fill="#5b4636">sandy soil: little organic carbon</text>
  <text x="15" y="255" font-size="15" fill="#1b4f7a">groundwater</text>
  <text x="15" y="375" font-size="15" fill="#fff">bedrock</text>
  <!-- training site -->
  <rect x="60" y="70" width="150" height="50" fill="#d0d6dd" stroke="#1b2a3a" stroke-width="2"/>
  <ellipse cx="135" cy="66" rx="70" ry="14" fill="#ffffff" stroke="#6b7785" stroke-width="2"/>
  <text class="b" x="230" y="70">1. Foam used at a</text>
  <text class="b" x="230" y="92">fire-training site</text>
  <!-- path -->
  <path d="M140,125 C150,200 220,260 330,280 S600,300 700,285" stroke="#c0392b" stroke-width="6" fill="none" stroke-dasharray="12 8" marker-end="url(#ar)"/>
  <text class="t" x="235" y="180">2. Seeps down: ionised,</text>
  <text class="t" x="235" y="200">weakly sorbed (low f<tspan font-size="11" baseline-shift="sub">oc</tspan>)</text>
  <text class="t" x="330" y="320">3. Travels with groundwater for years: no degradation</text>
  <!-- well -->
  <rect x="710" y="90" width="20" height="215" fill="#6b7785"/>
  <rect x="690" y="60" width="120" height="40" fill="#2468A0"/>
  <text x="750" y="86" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">waterworks</text>
  <text class="b" x="760" y="140">4. Pumped as</text>
  <text class="b" x="760" y="162">drinking water</text>
  <!-- house -->
  <path d="M850,70 L885,40 L920,70 Z" fill="#AD4825"/><rect x="858" y="70" width="54" height="40" fill="#c8693a"/>
  <line x1="812" y1="80" x2="850" y2="85" stroke="#2468A0" stroke-width="4"/>
  <text class="t" x="930" y="20" text-anchor="end">5. People: PFOS binds to</text>
  <text class="t" x="930" y="38" text-anchor="end">blood proteins for years</text>
</svg>
