<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: wet deposition by precipitation and dry deposition of gases and particles to surfaces. -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1b2a3a"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#AD4825"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2468A0"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#25713E"/></marker>
    <marker id="aro" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#b8860b"/></marker>
  </defs>
  <style>
    .t{font-size:24px;font-weight:bold;fill:#1b2a3a}
    .h{font-size:21px;font-weight:bold;fill:#1b2a3a;text-anchor:middle}
    .sp{font-size:26px;font-weight:bold;text-anchor:middle}
    .l{font-size:18px;fill:#1b2a3a}
    .lc{font-size:18px;fill:#1b2a3a;text-anchor:middle}
    .n{font-size:16px;fill:#6b7785;font-style:italic;text-anchor:middle}
    .ln{stroke:#1b2a3a;stroke-width:2.5;fill:none}
  </style>
  <line x1="490" y1="10" x2="490" y2="410" stroke="#c9d1da" stroke-width="2"/>
  <text class="h" x="245" y="35" fill="#2468A0">WET deposition</text>
  <ellipse cx="245" cy="108" rx="150" ry="45" fill="#d0d6dd"/>
  <g fill="#2468A0"><circle cx="190" cy="103" r="6"/><circle cx="230" cy="118" r="6"/><circle cx="280" cy="98" r="6"/><circle cx="310" cy="118" r="6"/></g>
  <text class="lc" x="245" y="58" font-size="15">droplets dissolve acids and particles</text>
  <g stroke="#2468A0" stroke-width="3"><line x1="170" y1="155" x2="160" y2="195"/><line x1="220" y1="160" x2="210" y2="200"/><line x1="270" y1="155" x2="260" y2="195"/><line x1="320" y1="160" x2="310" y2="200"/>
  <line x1="185" y1="215" x2="175" y2="255"/><line x1="245" y1="220" x2="235" y2="260"/><line x1="300" y1="215" x2="290" y2="255"/></g>
  <rect x="40" y="280" width="410" height="20" fill="#cfe3c4"/>
  <text class="lc" x="245" y="330">rain, snow, fog and cloud water</text>
  <rect x="55" y="350" width="380" height="50" rx="10" fill="#f6efe0" stroke="#b8860b" stroke-width="2"/>
  <text class="lc" x="245" y="382" font-weight="bold">flux = concentration in rain × rain amount</text>
  <text class="h" x="735" y="35" fill="#AD4825">DRY deposition</text>
  <path d="M640,280 C640,200 620,170 650,140 C680,170 660,200 660,280 Z" fill="#25713E"/>
  <path d="M760,280 L760,190" stroke="#7a5a2b" stroke-width="8"/><ellipse cx="760" cy="170" rx="55" ry="40" fill="#25713E"/>
  <rect x="510" y="280" width="450" height="20" fill="#cfe3c4"/>
  <text x="560" y="90" font-size="18" fill="#AD4825" font-weight="bold">SO₂</text><line x1="580" y1="98" x2="630" y2="160" stroke="#AD4825" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="840" y="80" font-size="18" fill="#AD4825" font-weight="bold">HNO₃</text><line x1="850" y1="88" x2="800" y2="145" stroke="#AD4825" stroke-width="2.5" marker-end="url(#arr)"/>
  <g fill="#AD4825"><circle cx="890" cy="150" r="5"/><circle cx="905" cy="185" r="5"/><circle cx="880" cy="215" r="5"/></g>
  <line x1="895" y1="160" x2="895" y2="272" stroke="#AD4825" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arr)"/>
  <text x="915" y="230" font-size="16" fill="#AD4825">particles</text>
  <text class="lc" x="735" y="330">gases taken up by leaves and soil;</text>
  <text class="lc" x="735" y="353">particles settle or stick to surfaces</text>
  <text class="n" x="735" y="388">happens in dry weather too; not seen in a rain sample</text>
</svg>
