<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: acid equivalents. HNO3 gives 1 H+ per molecule, H2SO4 gives 2. -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1b2a3a"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#AD4825"/></marker>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#2468A0"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#25713E"/></marker>
    <marker id="aro" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#b8860b"/></marker>
  </defs>
  <style>
    .t{font-size:24px;font-weight:bold;fill:#1b2a3a}
    .h{font-size:21px;font-weight:bold;fill:#1b2a3a;text-anchor:middle}
    .sp{font-size:26px;font-weight:bold;text-anchor:middle}
    .l{font-size:18px;fill:#1b2a3a}
    .lc{font-size:18px;fill:#1b2a3a;text-anchor:middle}
    .n{font-size:16px;fill:#6b7785;font-style:italic;text-anchor:middle}
    .ln{stroke:#1b2a3a;stroke-width:2.5;fill:none}
  </style>
  <text class="h" x="150" y="40">1 mol HNO₃</text>
  <circle cx="150" cy="110" r="40" fill="#fff" stroke="#2468A0" stroke-width="3"/><text class="lc" x="150" y="117" font-weight="bold">NO₃⁻</text>
  <circle cx="215" cy="110" r="17" fill="#AD4825"/><text x="215" y="116" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">H⁺</text>
  <text class="h" x="150" y="195" fill="#AD4825">1 eq</text>
  <text class="h" x="450" y="40">1 mol H₂SO₄</text>
  <circle cx="450" cy="110" r="40" fill="#fff" stroke="#2468A0" stroke-width="3"/><text class="lc" x="450" y="117" font-weight="bold">SO₄²⁻</text>
  <circle cx="385" cy="110" r="17" fill="#AD4825"/><text x="385" y="116" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">H⁺</text><circle cx="515" cy="110" r="17" fill="#AD4825"/><text x="515" y="116" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">H⁺</text>
  <text class="h" x="450" y="195" fill="#AD4825">2 eq</text>
  <line x1="20" y1="225" x2="580" y2="225" stroke="#c9d1da" stroke-width="2"/>
  <text class="h" x="300" y="262">Per m² per year in the teaching catchment</text>
  <text class="lc" x="300" y="300">0.0200 mol HNO₃ × 1 = 0.0200 eq</text>
  <text class="lc" x="300" y="332">0.0100 mol H₂SO₄ × 2 = 0.0200 eq</text>
  <line x1="130" y1="348" x2="470" y2="348" stroke="#1b2a3a" stroke-width="2"/>
  <text class="h" x="300" y="385">total 0.0400 eq m⁻² yr⁻¹</text>
  <text class="n" x="300" y="430">Equal moles of H₂SO₄ carry twice the acid of HNO₃.</text>
</svg>
