  <text x="85" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="143" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <text x="201" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="259" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="317" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <text x="375" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="433" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="491" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <text x="549" y="81" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <rect x="60" y="240" width="520" height="22" rx="0" fill="#d9c08f" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="60" y="262" width="520" height="26" rx="0" fill="#b98d4e" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="60" y="288" width="520" height="22" rx="0" fill="#d9c08f" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="85" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="143" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <text x="201" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="259" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="317" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <text x="375" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="433" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="491" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" >−</text>
  <text x="549" y="281" font-size="22" fill="white" text-anchor="middle" font-weight="bold" ></text>
  <text x="600" y="66" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal" >Si–O sheet</text>
  <text x="600" y="92" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal" >Al–O sheet</text>
  <text x="600" y="115" font-size="15" fill="#6b7785" text-anchor="start" font-weight="normal" >Si–O sheet</text>
  <text x="320" y="130" font-size="10" fill="#1b2a3a" text-anchor="start" font-weight="normal" ></text>
  <circle cx="110" cy="175" r="20" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <text x="110" y="181" font-size="14" fill="white" text-anchor="middle" font-weight="bold" >Ca²⁺</text>
  <circle cx="215" cy="175" r="20" fill="#9aa5b3" stroke="none" stroke-width="2"/>
  <text x="215" y="181" font-size="14" fill="white" text-anchor="middle" font-weight="bold" >Na⁺</text>
  <circle cx="320" cy="175" r="20" fill="#9aa5b3" stroke="none" stroke-width="2"/>
  <text x="320" y="181" font-size="14" fill="white" text-anchor="middle" font-weight="bold" >K⁺</text>
  <circle cx="425" cy="175" r="20" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <text x="425" y="181" font-size="14" fill="white" text-anchor="middle" font-weight="bold" >Ca²⁺</text>
  <circle cx="530" cy="175" r="20" fill="#9aa5b3" stroke="none" stroke-width="2"/>
  <text x="530" y="181" font-size="14" fill="white" text-anchor="middle" font-weight="bold" >Na⁺</text>
  <text x="320" y="162" font-size="10" fill="#1b2a3a" text-anchor="start" font-weight="normal" ></text>
  <text x="600" y="180" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >interlayer with water and</text>
  <text x="600" y="200" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold" >exchangeable cations</text>
  <rect x="640" y="260" width="320" height="120" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
  <text x="800" y="290" font-size="19" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >Cation exchange</text>
  <text x="800" y="325" font-size="17" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >clay–Ca + 2Na⁺ ⇌ clay–Na₂ + Ca²⁺</text>
  <text x="800" y="352.0" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="normal" >charge for charge, not atom for atom</text>
  <text x="60" y="345.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >Some Si⁴⁺ is replaced by Al³⁺, and some Al³⁺ by Mg²⁺.</text>
  <text x="60" y="365.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >The layers are left with a negative charge that does not depend on pH.</text>
</svg>
