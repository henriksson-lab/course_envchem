<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" font-family="Helvetica, Arial, sans-serif">
  <!-- Predominance along the pH axis, 25 C teaching constants. x = 60 + (pH-2)*80 -->
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5 L0,10 Z" fill="#1b2a3a"/></marker>
  </defs>
  <style>
    .sp{font-size:28px;font-weight:bold;fill:#fff;text-anchor:middle}
    .tick{font-size:17px;fill:#1b2a3a;text-anchor:middle}
    .pk{font-size:18px;font-weight:bold;fill:#1b2a3a;text-anchor:middle}
    .dir{font-size:19px;fill:#1b2a3a}
  </style>
  <rect x="60" y="70" width="348" height="70" fill="#2468A0"/>
  <rect x="408" y="70" width="318.4" height="70" fill="#25713E"/>
  <rect x="726.4" y="70" width="193.6" height="70" fill="#AD4825"/>
  <text class="sp" x="234" y="115">CO₂* dominates</text>
  <text class="sp" x="567" y="115">HCO₃⁻ dominates</text>
  <text class="sp" x="823" y="115">CO₃²⁻</text>
  <line x1="408" y1="55" x2="408" y2="150" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="726.4" y1="55" x2="726.4" y2="150" stroke="#1b2a3a" stroke-width="3"/>
  <text class="pk" x="408" y="45">pK₁ = 6.35</text>
  <text class="pk" x="726.4" y="45">pK₂ = 10.33</text>
  <line x1="60" y1="140" x2="920" y2="140" stroke="#1b2a3a" stroke-width="2"/>
  <g>
    <text class="tick" x="60" y="165">2</text><text class="tick" x="140" y="165">3</text><text class="tick" x="220" y="165">4</text>
    <text class="tick" x="300" y="165">5</text><text class="tick" x="380" y="165">6</text><text class="tick" x="460" y="165">7</text>
    <text class="tick" x="540" y="165">8</text><text class="tick" x="620" y="165">9</text><text class="tick" x="700" y="165">10</text>
    <text class="tick" x="780" y="165">11</text><text class="tick" x="860" y="165">12</text>
    <text class="tick" x="945" y="146" font-weight="bold">pH</text>
  </g>
  <line x1="440" y1="205" x2="140" y2="205" stroke="#c0392b" stroke-width="4" marker-end="url(#ar)"/>
  <text class="dir" x="455" y="211" fill="#c0392b" font-weight="bold">add acid: species shift left, H⁺ is taken up</text>
  <text class="dir" x="60" y="242" fill="#6b7785" font-size="16">At pH = pK the two neighbouring species are equal. Each pH unit further away changes their ratio tenfold.</text>
</svg>
