<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Mechanism: 2 XNa + Ca2+ = X2Ca + 2 Na+ on a negatively charged clay surface. Charge is conserved; one Ca2+ occupies two sites. -->
  <defs>
    <marker id="ar" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6 L0,12 Z" fill="#1b2a3a"/></marker>
    <g id="na"><circle r="15" fill="#d9b26f"/><text y="5" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Na⁺</text></g>
    <g id="ca"><circle r="20" fill="#2468A0"/><text y="6" font-size="15" text-anchor="middle" font-weight="bold" fill="#fff">Ca²⁺</text></g>
    <g id="neg"><text y="6" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">−</text></g>
  </defs>
  <style>
    .hd{font-size:22px;font-weight:bold;fill:#1b2a3a;text-anchor:middle}
    .t{font-size:17px;fill:#1b2a3a}
  </style>
  <text class="hd" x="215" y="30">Before</text>
  <text class="hd" x="725" y="30">After</text>
  <!-- solution -->
  <rect x="20" y="45" width="390" height="150" fill="#d6e6f2"/>
  <rect x="530" y="45" width="390" height="150" fill="#d6e6f2"/>
  <text x="30" y="68" font-size="15" fill="#2468A0">soil solution</text>
  <text x="540" y="68" font-size="15" fill="#2468A0">soil solution</text>
  <use href="#ca" x="215" y="110"/>
  <use href="#na" x="700" y="100"/><use href="#na" x="770" y="125"/>
  <!-- clay -->
  <rect x="20" y="195" width="390" height="60" fill="#c9a66b" stroke="#AD4825" stroke-width="2"/>
  <rect x="530" y="195" width="390" height="60" fill="#c9a66b" stroke="#AD4825" stroke-width="2"/>
  <text x="215" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle">clay particle</text>
  <text x="725" y="240" font-size="16" fill="#1b2a3a" text-anchor="middle">clay particle</text>
  <!-- sites -->
  <use href="#neg" x="80" y="205"/><use href="#neg" x="160" y="205"/><use href="#neg" x="250" y="205"/><use href="#neg" x="340" y="205"/>
  <use href="#neg" x="590" y="205"/><use href="#neg" x="670" y="205"/><use href="#neg" x="760" y="205"/><use href="#neg" x="850" y="205"/>
  <use href="#na" x="80" y="178"/><use href="#na" x="160" y="178"/><use href="#na" x="250" y="178"/><use href="#na" x="340" y="178"/>
  <use href="#ca" x="630" y="174"/><line x1="612" y1="186" x2="594" y2="200" stroke="#2468A0" stroke-width="2"/><line x1="648" y1="186" x2="666" y2="200" stroke="#2468A0" stroke-width="2"/>
  <use href="#na" x="760" y="178"/><use href="#na" x="850" y="178"/>
  <!-- arrow -->
  <line x1="425" y1="150" x2="515" y2="150" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="515" y1="172" x2="425" y2="172" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
  <text x="470" y="135" font-size="15" fill="#1b2a3a" text-anchor="middle">reversible</text>
  <!-- equation and bookkeeping -->
  <text x="470" y="300" font-size="22" fill="#1b2a3a" text-anchor="middle">2 XNa + Ca²⁺ ⇌ X₂Ca + 2 Na⁺</text>
  <rect x="60" y="320" width="820" height="66" rx="10" fill="#f6efe0"/>
  <text class="t" x="85" y="347"><tspan font-weight="bold">Sites:</tspan> 4 negative charges before, 4 after. Charge is conserved.</text>
  <text class="t" x="85" y="372"><tspan font-weight="bold">Ions:</tspan> one Ca²⁺ takes the place of two Na⁺. Count charge, not ions.</text>
</svg>
