<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: one CaCO3 neutralises 2 H+ when the final water is acidic (carbon leaves as CO2*) but only 1 H+ when the final water is near neutral (carbon stays as HCO3-). -->
  <defs>
    <g id="h"><circle r="14" fill="#c0392b"/><text y="5" font-size="12" text-anchor="middle" fill="#fff" font-weight="bold">H⁺</text></g>
    <g id="cc"><rect x="-24" y="-16" width="48" height="32" rx="5" fill="#eee8dc" stroke="#8e9aaf" stroke-width="2"/><text y="5" font-size="12" text-anchor="middle" fill="#1b2a3a">CaCO₃</text></g>
  </defs>
  <style>.hd{font-size:18px;font-weight:bold;fill:#1b2a3a;text-anchor:middle}.t{font-size:16px;fill:#1b2a3a;text-anchor:middle}</style>
  <text class="hd" x="140" y="28">Acidic endpoint</text>
  <text class="hd" x="420" y="28">Near-neutral endpoint</text>
  <rect x="30" y="45" width="220" height="230" rx="10" fill="#d6e6f2"/>
  <rect x="310" y="45" width="220" height="230" rx="10" fill="#d6e6f2"/>
  <use href="#cc" x="140" y="235"/><use href="#h" x="110" y="190"/><use href="#h" x="170" y="190"/>
  <circle cx="120" cy="100" r="11" fill="none" stroke="#2468A0" stroke-width="2"/><circle cx="150" cy="75" r="8" fill="none" stroke="#2468A0" stroke-width="2"/>
  <text x="175" y="105" font-size="15" fill="#2468A0">CO₂</text>
  <use href="#cc" x="420" y="235"/><use href="#h" x="420" y="190"/>
  <text x="420" y="110" font-size="16" fill="#25713E" text-anchor="middle" font-weight="bold">HCO₃⁻ stays</text>
  <text class="t" x="140" y="305"><tspan font-weight="bold" fill="#c0392b">2 H⁺</tspan> per CaCO₃</text>
  <text class="t" x="420" y="305"><tspan font-weight="bold" fill="#c0392b">1 H⁺</tspan> per CaCO₃</text>
  <text class="t" x="140" y="330">2 eq/mol</text>
  <text class="t" x="420" y="330">1 eq/mol</text>
  <rect x="30" y="355" width="500" height="50" rx="10" fill="#f6efe0"/>
  <text class="t" x="280" y="386">Same mineral, factor 2 difference: <tspan font-weight="bold">state the endpoint</tspan>.</text>
</svg>
