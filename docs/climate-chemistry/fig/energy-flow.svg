  <polyline points="950.0,330.0 955.7,326.3 958.0,322.6 955.7,318.9 950.0,315.2 944.3,311.5 942.0,307.8 944.3,304.1 950.0,300.4 955.7,296.8 958.0,293.1 955.7,289.4 950.0,285.7 944.3,282.0 942.0,278.3 944.3,274.6 950.0,270.9 955.7,267.2 958.0,263.5 955.7,259.8 950.0,256.1 944.3,252.4 942.0,248.7 944.3,245.0 950.0,241.3 955.7,237.6 958.0,233.9 955.7,230.2 950.0,226.6 944.3,222.9 942.0,219.2 944.3,215.5 950.0,211.8 955.7,208.1 958.0,204.4 955.7,200.7 950.0,197.0 944.3,193.3 942.0,189.6 944.3,185.9 950.0,182.2 955.7,178.5 958.0,174.8 955.7,171.1 950.0,167.4 944.3,163.8 942.0,160.1 944.3,156.4 950.0,152.7 955.7,149.0 958.0,145.3 955.7,141.6 950.0,137.9 944.3,134.2 942.0,130.5 944.3,126.8 950.0,123.1 955.7,119.4 958.0,115.7 955.7,112.0 950.0,108.3 944.3,104.6 942.0,100.9 944.3,97.2 950.0,93.6 955.7,89.9 958.0,86.2 950.0,82.5 950.0,78.8 950.0,75.1 950.0,71.4 950.0,67.7 950.0,64.0" fill="none" stroke="#AD4825" stroke-width="3" marker-end="url(#arr)"/>
  <text x="935" y="230" text-anchor="end" font-size="16" fill="#AD4825">window:</text><text x="935" y="252" text-anchor="end" font-size="16" fill="#AD4825">some escapes</text><text x="935" y="274" text-anchor="end" font-size="16" fill="#AD4825">directly</text>
</svg>
