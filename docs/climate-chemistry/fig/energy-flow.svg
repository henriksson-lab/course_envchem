  <text x="400" y="290" font-size="18" fill="#AD4825" font-weight="bold">infrared</text><text x="400" y="312" font-size="16" fill="#AD4825">(longwave)</text>
  <circle cx="540" cy="170" r="9" fill="#1b2a3a"/><circle cx="527" cy="170" r="7" fill="#c0392b"/><circle cx="553" cy="170" r="7" fill="#c0392b"/>
  <circle cx="600" cy="150" r="9" fill="#1b2a3a"/><circle cx="587" cy="150" r="7" fill="#c0392b"/><circle cx="613" cy="150" r="7" fill="#c0392b"/>
  <circle cx="570" cy="120" r="9" fill="#1b2a3a"/><circle cx="557" cy="120" r="7" fill="#c0392b"/><circle cx="583" cy="120" r="7" fill="#c0392b"/>
  <circle cx="650" cy="175" r="9" fill="#1b2a3a"/><circle cx="637" cy="175" r="7" fill="#c0392b"/><circle cx="663" cy="175" r="7" fill="#c0392b"/>
  <circle cx="690" cy="130" r="9" fill="#1b2a3a"/><circle cx="677" cy="130" r="7" fill="#c0392b"/><circle cx="703" cy="130" r="7" fill="#c0392b"/>
  <text x="720" y="110" font-size="17" fill="#1b2a3a">greenhouse gas molecules</text><text x="720" y="132" font-size="17" fill="#1b2a3a">absorb, then re-emit</text><text x="720" y="154" font-size="17" fill="#1b2a3a">in all directions</text>
