<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: treatment either transfers an element to another phase or transforms its chemical form -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2468A0"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#25713E"/></marker>
  </defs>
  <rect x="20" y="20" width="470" height="360" rx="10" fill="#f4f6f8" stroke="#8a6a3f" stroke-width="3"/>
  <text x="255" y="58" font-size="26" fill="#8a6a3f" text-anchor="middle" font-weight="bold" >TRANSFER</text>
  <text x="255" y="86" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >same element, new place</text>
  <text x="45" y="130" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="bold" >settling / filtration</text>
  <text x="45" y="156" font-size="17" fill="#6b7785" text-anchor="start" font-weight="normal" >particles → sludge</text>
  <text x="45" y="192" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="bold" >precipitation</text>
  <text x="45" y="218" font-size="17" fill="#6b7785" text-anchor="start" font-weight="normal" >PO₄³⁻ + Fe³⁺ → FePO₄(s)</text>
  <text x="45" y="254" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="bold" >sorption</text>
  <text x="45" y="280" font-size="17" fill="#6b7785" text-anchor="start" font-weight="normal" >solute → solid surface</text>
  <text x="45" y="316" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="bold" >gas stripping</text>
  <text x="45" y="342" font-size="17" fill="#6b7785" text-anchor="start" font-weight="normal" >NH₃, CO₂ → air</text>
  <rect x="510" y="20" width="470" height="360" rx="10" fill="#f4f6f8" stroke="#25713E" stroke-width="3"/>
  <text x="745" y="58" font-size="26" fill="#25713E" text-anchor="middle" font-weight="bold" >TRANSFORM</text>
  <text x="745" y="86" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >new chemical form</text>
  <text x="535" y="130" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="bold" >nitrification</text>
  <text x="535" y="156" font-size="17" fill="#6b7785" text-anchor="start" font-weight="normal" >NH₄⁺ → NO₃⁻ (N still in water)</text>
  <text x="535" y="192" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="bold" >denitrification</text>
  <text x="535" y="218" font-size="17" fill="#6b7785" text-anchor="start" font-weight="normal" >NO₃⁻ → N₂ (leaves as gas)</text>
  <text x="535" y="254" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="bold" >organic oxidation</text>
  <text x="535" y="280" font-size="17" fill="#6b7785" text-anchor="start" font-weight="normal" >CH₂O → CO₂</text>
  <text x="535" y="316" font-size="19" fill="#1b2a3a" text-anchor="start" font-weight="bold" >disinfection</text>
  <text x="535" y="342" font-size="17" fill="#6b7785" text-anchor="start" font-weight="normal" >microbes inactivated; by-products form</text>
</svg>
