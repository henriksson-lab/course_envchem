<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: concentration is not amount; element vs compound basis. Each dot = 0.5 mg. -->
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#1b2a3a"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4 L0,8 Z" fill="#AD4825"/></marker>
  </defs>
  <style>
    .t{font-size:24px;font-weight:bold;fill:#1b2a3a}
    .h{font-size:21px;font-weight:bold;fill:#1b2a3a;text-anchor:middle}
    .l{font-size:18px;fill:#1b2a3a}
    .lc{font-size:18px;fill:#1b2a3a;text-anchor:middle}
    .n{font-size:16px;fill:#6b7785;font-style:italic;text-anchor:middle}
    .ln{stroke:#1b2a3a;stroke-width:2.5;fill:none}
  </style>
  <text class="h" x="160" y="34">Sample 1</text>
  <rect x="100" y="140" width="120" height="160" fill="#d6e6f2" stroke="#1b2a3a" stroke-width="2"/>
<circle cx="155" cy="228" r="7" fill="#AD4825"/>
  <circle cx="202" cy="215" r="7" fill="#AD4825"/>
  <circle cx="128" cy="222" r="7" fill="#AD4825"/>
  <circle cx="173" cy="261" r="7" fill="#AD4825"/>
  <circle cx="119" cy="192" r="7" fill="#AD4825"/>
  <circle cx="119" cy="263" r="7" fill="#AD4825"/>
  <text class="lc" x="160" y="335">1.0 L × 3.0 mg/L</text>
  <text class="h" x="160" y="368">= 3.0 mg</text>
  <text class="h" x="500" y="34">Sample 2</text>
  <rect x="340" y="60" width="320" height="240" fill="#d6e6f2" stroke="#1b2a3a" stroke-width="2"/>
<circle cx="558" cy="79" r="7" fill="#AD4825"/>
  <circle cx="645" cy="282" r="7" fill="#AD4825"/>
  <circle cx="546" cy="205" r="7" fill="#AD4825"/>
  <circle cx="397" cy="73" r="7" fill="#AD4825"/>
  <circle cx="509" cy="83" r="7" fill="#AD4825"/>
  <circle cx="407" cy="123" r="7" fill="#AD4825"/>
  <circle cx="359" cy="172" r="7" fill="#AD4825"/>
  <circle cx="482" cy="255" r="7" fill="#AD4825"/>
  <circle cx="506" cy="211" r="7" fill="#AD4825"/>
  <circle cx="487" cy="131" r="7" fill="#AD4825"/>
  <circle cx="602" cy="226" r="7" fill="#AD4825"/>
  <circle cx="445" cy="121" r="7" fill="#AD4825"/>
  <text class="lc" x="500" y="335">10 L × 0.60 mg/L</text>
  <text class="h" x="500" y="368">= 6.0 mg</text>
  <text class="n" x="330" y="410">Lower concentration, twice the solute. Each dot = 0.5 mg.</text>
  <rect x="700" y="60" width="270" height="240" rx="12" fill="#f6efe0" stroke="#b8860b" stroke-width="2"/>
  <text class="h" x="835" y="95">Say what you count</text>
  <text class="lc" x="835" y="135">10.0 mg NO₃⁻ per L</text>
  <text class="lc" x="835" y="160">contains only</text>
  <text class="lc" x="835" y="185">2.26 mg N per L</text>
  <text class="n" x="835" y="222">N is 14.0 of the 62.0 g/mol</text>
  <text class="n" x="835" y="246">factor 62.0 / 14.0 = 4.43</text>
  <text class="lc" x="835" y="282" font-weight="bold">same water, two numbers</text>
</svg>
