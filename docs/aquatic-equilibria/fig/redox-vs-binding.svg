<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: a redox change moves an electron and changes oxidation state; complexation binds a ligand and does not. -->
  <defs><marker id="ar" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6 L0,12 Z" fill="#1b2a3a"/></marker></defs>
  <style>.b{font-size:24px;font-weight:bold;fill:#1b2a3a;text-anchor:middle} .t{font-size:19px;fill:#1b2a3a;text-anchor:middle} .w{font-size:20px;font-weight:bold;fill:#fff;text-anchor:middle}</style>
  <text class="b" x="235" y="34">Redox: an electron moves</text>
  <circle cx="100" cy="150" r="42" fill="#7fa37f"/><text class="w" x="100" y="157">Fe²⁺</text>
  <line x1="160" y1="150" x2="300" y2="150" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
  <circle cx="370" cy="150" r="42" fill="#AD4825"/><text class="w" x="370" y="157">Fe³⁺</text>
  <circle cx="232" cy="92" r="15" fill="#2468A0"/><text class="w" x="232" y="99" font-size="17">e⁻</text>
  <path d="M232,108 Q232,130 232,130" stroke="#2468A0"/>
  <text class="t" x="232" y="64">electron leaves</text>
  <text class="t" x="235" y="235">oxidation state +2 → +3</text>
  <text class="t" x="235" y="265">needs an electron acceptor, e.g. O₂</text>
  <rect x="25" y="290" width="420" height="50" rx="8" fill="#f6efe0"/><text class="t" x="235" y="322">Fe³⁺ + e⁻ ⇌ Fe²⁺</text>
  <line x1="480" y1="20" x2="480" y2="340" stroke="#c6cdd6" stroke-width="2"/>
  <text class="b" x="720" y="34">Complexation: no electron moves</text>
  <circle cx="590" cy="150" r="42" fill="#AD4825"/><text class="w" x="590" y="157">Fe³⁺</text>
  <line x1="650" y1="150" x2="760" y2="150" stroke="#1b2a3a" stroke-width="3" marker-end="url(#ar)"/>
  <text class="t" x="705" y="125">+ ligand</text>
  <circle cx="850" cy="150" r="62" fill="none" stroke="#25713E" stroke-width="8" stroke-dasharray="12 6"/>
  <circle cx="850" cy="150" r="42" fill="#AD4825"/><text class="w" x="850" y="157">Fe³⁺</text>
  <text class="t" x="720" y="235">oxidation state stays +3</text>
  <text class="t" x="720" y="265">free ion falls, total Fe unchanged</text>
  <rect x="510" y="290" width="420" height="50" rx="8" fill="#f6efe0"/><text class="t" x="720" y="322">Fe³⁺ + ligand ⇌ Fe–ligand complex</text>
</svg>