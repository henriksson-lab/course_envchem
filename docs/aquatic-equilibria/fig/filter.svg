<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: an operational "dissolved" fraction. A 0.45 micrometre filter retains particles; free ions, complexes and small colloids pass and are reported together as one element total. -->
  <defs>
    <g id="ion"><circle r="9" fill="#AD4825"/><text y="5" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Fe</text></g>
    <g id="cpx"><circle r="20" fill="none" stroke="#25713E" stroke-width="5" stroke-dasharray="7 4"/><circle r="9" fill="#AD4825"/><text y="5" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">Fe</text></g>
    <g id="col"><circle cx="-7" cy="-5" r="8" fill="#c98b5a"/><circle cx="7" cy="-4" r="8" fill="#c98b5a"/><circle cx="0" cy="7" r="8" fill="#c98b5a"/><circle cx="0" cy="0" r="5" fill="#AD4825"/></g>
    <g id="par"><path d="M-30,-18 L18,-26 L34,4 L12,26 L-26,20 Z" fill="#8c6b4f"/><circle cx="2" cy="0" r="6" fill="#AD4825"/></g>
  </defs>
  <style>.t{font-size:19px;fill:#1b2a3a} .b{font-size:22px;font-weight:bold;fill:#1b2a3a} .s{font-size:16px;fill:#6b7785}</style>
  <text class="b" x="40" y="34">Whole water sample</text>
  <rect x="40" y="48" width="480" height="150" rx="10" fill="#d6e6f2"/>
  <use href="#ion" x="90" y="90"/><use href="#ion" x="150" y="160"/><use href="#ion" x="250" y="110"/>
  <use href="#cpx" x="200" y="80"/><use href="#cpx" x="320" y="160"/>
  <use href="#col" x="380" y="90"/><use href="#col" x="110" y="150"/>
  <use href="#par" x="460" y="100"/><use href="#par" x="270" y="170"/>
  <line x1="40" y1="222" x2="520" y2="222" stroke="#1b2a3a" stroke-width="5" stroke-dasharray="3 6"/>
  <text class="s" x="40" y="250">filter membrane, for example 0.45 µm pores</text>
  <use href="#par" x="230" y="210"/><use href="#par" x="400" y="210"/>
  <text class="b" x="40" y="290">Filtrate ("dissolved", by definition of the method)</text>
  <rect x="40" y="302" width="480" height="110" rx="10" fill="#d6e6f2"/>
  <use href="#ion" x="90" y="340"/><use href="#ion" x="160" y="385"/><use href="#ion" x="270" y="345"/>
  <use href="#cpx" x="210" y="355"/><use href="#cpx" x="350" y="375"/>
  <use href="#col" x="420" y="335"/><use href="#col" x="110" y="385"/>
  <use href="#ion" x="580" y="70"/><text class="t" x="604" y="77">free hydrated ion</text>
  <use href="#cpx" x="580" y="125"/><text class="t" x="610" y="132">complex with a dissolved ligand</text>
  <use href="#col" x="580" y="180"/><text class="t" x="604" y="187">small colloid (passes the filter)</text>
  <use href="#par" x="582" y="240"/><text class="t" x="632" y="247">particle (retained)</text>
  <rect x="560" y="300" width="360" height="112" rx="10" fill="#f6efe0"/>
  <text class="t" x="578" y="332">The lab reports <tspan font-weight="bold">one number</tspan>:</text>
  <text class="t" x="578" y="360">total Fe in everything that passed.</text>
  <text class="t" x="578" y="388">It is <tspan font-weight="bold">not</tspan> the free-ion concentration.</text>
</svg>