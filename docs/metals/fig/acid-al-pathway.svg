  <text x="155" y="140" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
  <path d="M200,95 l-8,30" stroke="#2468A0" stroke-width="3" fill="none"/>
  <circle cx="190" cy="135" r="9" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="190" y="140" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
  <rect x="40" y="190" width="175" height="40" rx="0" fill="#eadcc3" stroke="none" stroke-width="2"/>
  <rect x="275" y="100" width="195" height="130" rx="6" fill="#eadcc3" stroke="none" stroke-width="0"/>
  <rect x="295" y="160" width="60" height="45" rx="4" fill="#c7ccd4" stroke="#6b7785" stroke-width="2"/>
  <text x="325" y="190" font-size="13" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >Al(OH)₃</text>
  <rect x="375" y="120" width="80" height="25" rx="0" fill="#c9b48c" stroke="#6b7785" stroke-width="2"/>
  <rect x="375" y="150" width="80" height="25" rx="0" fill="#c9b48c" stroke="#6b7785" stroke-width="2"/>
  <text x="415" y="202" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >clay</text>
  <circle cx="365" cy="115" r="8" fill="#c0392b" stroke="none" stroke-width="2"/>
  <text x="377" y="120" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold" >Al³⁺</text>
  <circle cx="335" cy="130" r="10" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="335" y="135" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
