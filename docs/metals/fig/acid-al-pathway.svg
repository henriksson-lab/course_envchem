  <circle cx="847" cy="120" r="5" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <circle cx="869" cy="112" r="5" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <circle cx="891" cy="120" r="5" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <circle cx="913" cy="112" r="5" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <circle cx="825" cy="172" r="5" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <circle cx="847" cy="164" r="5" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <circle cx="869" cy="172" r="5" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <circle cx="891" cy="164" r="5" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <text x="863" y="238" font-size="13" fill="#6b7785" text-anchor="middle" font-weight="normal" >grey: Al deposits (schematic)</text>
  <text x="500" y="368" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >Fish suffer from loss of salt balance and breathing problems.</text>
