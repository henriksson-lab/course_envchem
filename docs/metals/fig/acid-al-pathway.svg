<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: acid deposition mobilises aluminium from soil; inorganic Al deposits on fish gills -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2468A0"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#25713E"/></marker>
  </defs>
  <rect x="20" y="40" width="215" height="210" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
  <text x="32" y="72" font-size="20" fill="#1b2a3a" text-anchor="start" font-weight="bold" >1  Acid input</text>
  <text x="32" y="300.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >H⁺ and SO₄²⁻ arrive</text>
  <text x="32" y="320.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >with rain and snowmelt</text>
  <line x1="238" y1="145" x2="260" y2="145" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="265" y="40" width="215" height="210" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
  <text x="277" y="72" font-size="20" fill="#1b2a3a" text-anchor="start" font-weight="bold" >2  Soil</text>
  <text x="277" y="300.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >H⁺ dissolves Al(OH)₃ and</text>
  <text x="277" y="320.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >displaces Al³⁺ from clays</text>
  <line x1="483" y1="145" x2="505" y2="145" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="510" y="40" width="215" height="210" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
  <text x="522" y="72" font-size="20" fill="#1b2a3a" text-anchor="start" font-weight="bold" >3  Stream</text>
  <text x="522" y="300.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >inorganic Al³⁺, AlOH²⁺ are</text>
  <text x="522" y="320.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >carried with the runoff</text>
  <line x1="728" y1="145" x2="750" y2="145" stroke="#1b2a3a" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="755" y="40" width="215" height="210" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
  <text x="767" y="72" font-size="20" fill="#1b2a3a" text-anchor="start" font-weight="bold" >4  Fish gill</text>
  <text x="767" y="300.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >gill surface is less acidic:</text>
  <text x="767" y="320.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >Al hydrolyses and deposits</text>
  <path d="M60,95 l-8,30" stroke="#2468A0" stroke-width="3" fill="none"/>
  <circle cx="50" cy="135" r="9" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="50" y="140" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
