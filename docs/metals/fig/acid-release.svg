<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: three ways acid can raise a filtered metal concentration without redox -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2468A0"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#25713E"/></marker>
  </defs>
  <rect x="20" y="20" width="310" height="400" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
  <text x="175" y="55" font-size="22" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >Desorption</text>
  <rect x="50" y="170" width="250" height="40" rx="3" fill="#c9a16b" stroke="none" stroke-width="0"/>
  <line x1="75" y1="170" x2="75" y2="150" stroke="#6b7785" stroke-width="3"/>
  <circle cx="75" cy="140" r="12" fill="#c0392b" stroke="none" stroke-width="2"/>
  <line x1="125" y1="170" x2="125" y2="150" stroke="#6b7785" stroke-width="3"/>
  <circle cx="125" cy="142" r="8" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="125" y="147" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
  <line x1="175" y1="170" x2="175" y2="150" stroke="#6b7785" stroke-width="3"/>
  <circle cx="175" cy="142" r="8" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="175" y="147" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
  <line x1="225" y1="170" x2="225" y2="150" stroke="#6b7785" stroke-width="3"/>
  <circle cx="225" cy="140" r="12" fill="#c0392b" stroke="none" stroke-width="2"/>
  <line x1="275" y1="170" x2="275" y2="150" stroke="#6b7785" stroke-width="3"/>
  <circle cx="275" cy="142" r="8" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="275" y="147" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
  <circle cx="230" cy="90" r="12" fill="#c0392b" stroke="none" stroke-width="2"/>
  <path d="M220,128 Q210,110 223,100" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
  <text x="40" y="255.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >H⁺ competes for surface sites</text>
  <text x="40" y="275.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >and pushes M²⁺ off</text>
  <text x="40" y="330.0" font-size="16" fill="#2468A0" text-anchor="start" font-weight="bold" >Test: metal on the particles</text>
  <text x="40" y="350.0" font-size="16" fill="#2468A0" text-anchor="start" font-weight="bold" >falls as water metal rises</text>
  <rect x="350" y="20" width="310" height="400" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
  <text x="505" y="55" font-size="22" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >Dissolution</text>
  <rect x="430" y="120" width="150" height="90" rx="4" fill="#b9c2cc" stroke="#6b7785" stroke-width="2"/>
  <text x="505" y="172" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="normal" >M(OH)₂(s)</text>
  <path d="M430,120 l20,-15 l150,0 l-20,15" stroke="#6b7785" stroke-width="2" fill="#d5dbe1"/>
  <circle cx="410" cy="110" r="12" fill="#c0392b" stroke="none" stroke-width="2"/>
  <circle cx="605" cy="130" r="12" fill="#c0392b" stroke="none" stroke-width="2"/>
  <circle cx="600" cy="190" r="12" fill="#c0392b" stroke="none" stroke-width="2"/>
  <circle cx="410" cy="200" r="8" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="205" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
  <circle cx="470" cy="95" r="8" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="470" y="100" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
  <text x="370" y="255.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >H⁺ dissolves a metal-bearing</text>
  <text x="370" y="275.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >solid: M(OH)₂ + 2H⁺ → M²⁺ + 2H₂O</text>
  <text x="370" y="330.0" font-size="16" fill="#2468A0" text-anchor="start" font-weight="bold" >Test: solid phase shrinks;</text>
  <text x="370" y="350.0" font-size="16" fill="#2468A0" text-anchor="start" font-weight="bold" >compare with saturation</text>
  <rect x="680" y="20" width="310" height="400" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
  <text x="835" y="55" font-size="22" fill="#1b2a3a" text-anchor="middle" font-weight="bold" >Ligand protonation</text>
  <path d="M720,180 C770,120 820,230 880,160 S940,140 960,170" stroke="#8a5a2b" stroke-width="8" fill="none"/>
  <circle cx="790" cy="160" r="8" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="790" y="165" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold" >+</text>
  <circle cx="910" cy="100" r="12" fill="#c0392b" stroke="none" stroke-width="2"/>
  <path d="M885,150 Q885,120 898,108" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrR)"/>
  <text x="700" y="255.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >H⁺ binds to the ligand's groups;</text>
  <text x="700" y="275.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="normal" >metal binding is redistributed</text>
  <text x="700" y="330.0" font-size="16" fill="#2468A0" text-anchor="start" font-weight="bold" >Test: free vs total metal,</text>
  <text x="700" y="350.0" font-size="16" fill="#2468A0" text-anchor="start" font-weight="bold" >dissolved and particulate OM</text>
  <text x="500" y="425" font-size="10" fill="#1b2a3a" text-anchor="start" font-weight="normal" ></text>
</svg>
