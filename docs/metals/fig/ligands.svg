<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: ligands in natural water: simple inorganic ligands, a two-armed chelate, and organic matter with many binding groups -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2468A0"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#25713E"/></marker>
  </defs>
  <text x="30" y="40" font-size="21" fill="#1b2a3a" text-anchor="start" font-weight="bold" >1  Inorganic ligands</text>
  <rect x="60" y="60" width="100" height="44" rx="22" fill="#fbeee6" stroke="#AD4825" stroke-width="2"/>
  <text x="110" y="90" font-size="20" fill="#AD4825" text-anchor="middle" font-weight="bold" >OH⁻</text>
  <rect x="180" y="60" width="100" height="44" rx="22" fill="#fbeee6" stroke="#AD4825" stroke-width="2"/>
  <text x="230" y="90" font-size="20" fill="#AD4825" text-anchor="middle" font-weight="bold" >Cl⁻</text>
  <rect x="60" y="122" width="100" height="44" rx="22" fill="#fbeee6" stroke="#AD4825" stroke-width="2"/>
  <text x="110" y="152" font-size="20" fill="#AD4825" text-anchor="middle" font-weight="bold" >F⁻</text>
  <rect x="180" y="122" width="100" height="44" rx="22" fill="#fbeee6" stroke="#AD4825" stroke-width="2"/>
  <text x="230" y="152" font-size="20" fill="#AD4825" text-anchor="middle" font-weight="bold" >SO₄²⁻</text>
  <rect x="60" y="184" width="100" height="44" rx="22" fill="#fbeee6" stroke="#AD4825" stroke-width="2"/>
  <text x="110" y="214" font-size="20" fill="#AD4825" text-anchor="middle" font-weight="bold" >CO₃²⁻</text>
  <text x="30" y="300.0" font-size="16" fill="#6b7785" text-anchor="start" font-weight="normal" >one bond each to the metal</text>
  <text x="30" y="320.0" font-size="16" fill="#6b7785" text-anchor="start" font-weight="normal" >(monodentate)</text>
  <text x="350" y="40" font-size="21" fill="#1b2a3a" text-anchor="start" font-weight="bold" >2  A chelate: two arms, one ring</text>
  <path d="M400,200 L470,150 L540,160 L540,240 L470,250 Z" stroke="none" stroke-width="0" fill="#e9f2e9"/>
  <line x1="400" y1="200" x2="470" y2="150" stroke="#25713E" stroke-width="4"/>
  <line x1="400" y1="200" x2="470" y2="250" stroke="#25713E" stroke-width="4"/>
  <line x1="470" y1="150" x2="540" y2="160" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="540" y1="160" x2="540" y2="240" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="540" y1="240" x2="470" y2="250" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="536" y1="157" x2="591" y2="117" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="544" y1="163" x2="599" y2="123" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="536" y1="237" x2="591" y2="277" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="544" y1="243" x2="599" y2="283" stroke="#1b2a3a" stroke-width="3"/>
  <circle cx="400" cy="200" r="26" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <text x="400" y="207" font-size="20" fill="white" text-anchor="middle" font-weight="bold" >M</text>
  <circle cx="470" cy="150" r="13" fill="#c0392b" stroke="none" stroke-width="2"/>
  <circle cx="470" cy="250" r="13" fill="#c0392b" stroke="none" stroke-width="2"/>
  <circle cx="595" cy="120" r="13" fill="#c0392b" stroke="none" stroke-width="2"/>
  <circle cx="595" cy="280" r="13" fill="#c0392b" stroke="none" stroke-width="2"/>
  <circle cx="540" cy="160" r="12" fill="#444" stroke="none" stroke-width="2"/>
  <circle cx="540" cy="240" r="12" fill="#444" stroke="none" stroke-width="2"/>
  <text x="480" y="205" font-size="16" fill="#25713E" text-anchor="middle" font-weight="bold" >ring</text>
  <text x="350" y="330.0" font-size="16" fill="#6b7785" text-anchor="start" font-weight="normal" >oxalate binds with two O atoms;</text>
  <text x="350" y="350.0" font-size="16" fill="#6b7785" text-anchor="start" font-weight="normal" >chelates bind much more strongly</text>
  <text x="680" y="40" font-size="21" fill="#1b2a3a" text-anchor="start" font-weight="bold" >3  Dissolved organic matter</text>
  <path d="M685,245 l35,-15 l35,15 l35,-15 l35,15 l35,-15 l35,15 l35,-15 l35,15" stroke="#8a5a2b" stroke-width="8" fill="none"/>
  <line x1="720" y1="230" x2="720" y2="190" stroke="#8a5a2b" stroke-width="4"/>
  <circle cx="720" cy="180" r="11" fill="#c0392b" stroke="none" stroke-width="2"/>
  <line x1="790" y1="230" x2="790" y2="190" stroke="#8a5a2b" stroke-width="4"/>
  <circle cx="790" cy="180" r="11" fill="#c0392b" stroke="none" stroke-width="2"/>
  <line x1="860" y1="230" x2="860" y2="190" stroke="#8a5a2b" stroke-width="4"/>
  <circle cx="860" cy="180" r="11" fill="#c0392b" stroke="none" stroke-width="2"/>
  <line x1="930" y1="230" x2="930" y2="190" stroke="#8a5a2b" stroke-width="4"/>
  <circle cx="930" cy="180" r="11" fill="#c0392b" stroke="none" stroke-width="2"/>
  <line x1="755" y1="125" x2="720" y2="180" stroke="#25713E" stroke-width="3.5"/>
  <line x1="755" y1="125" x2="790" y2="180" stroke="#25713E" stroke-width="3.5"/>
  <circle cx="755" cy="120" r="17" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <text x="755" y="126" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >M</text>
  <line x1="895" y1="125" x2="860" y2="180" stroke="#25713E" stroke-width="3.5"/>
  <line x1="895" y1="125" x2="930" y2="180" stroke="#25713E" stroke-width="3.5"/>
  <circle cx="895" cy="120" r="17" fill="#7f8c9d" stroke="none" stroke-width="2"/>
  <text x="895" y="126" font-size="16" fill="white" text-anchor="middle" font-weight="bold" >M</text>
  <text x="825" y="290" font-size="15" fill="#8a5a2b" text-anchor="middle" font-weight="normal" >red: O⁻ of carboxyl (COO⁻) and phenol groups</text>
</svg>
