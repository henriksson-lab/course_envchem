<svg xmlns="http://www.w3.org/2000/svg" width="500" height="420" viewBox="0 0 500 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: Kow measurement. Shake the compound with octanol and water; at equilibrium Kow = C_octanol / C_water. Here 10 molecules in octanol for 1 in water (equal volumes): Kow = 10, log Kow = 1. -->
  <style>.t{font-size:17px;fill:#1b2a3a}</style>
  <path d="M120,40 L120,360 Q120,390 150,390 L310,390 Q340,390 340,360 L340,40" fill="none" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="122" y="80" width="216" height="140" fill="#f4e3a1"/>
  <rect x="122" y="220" width="216" height="168" fill="#d6e6f2"/>
  <text x="230" y="108" font-size="17" font-weight="bold" fill="#8a6d00" text-anchor="middle">octanol</text>
  <text x="230" y="378" font-size="17" font-weight="bold" fill="#2468A0" text-anchor="middle">water</text>
  <g fill="#AD4825">
    <circle cx="150" cy="135" r="8"/><circle cx="185" cy="160" r="8"/><circle cx="215" cy="130" r="8"/><circle cx="250" cy="165" r="8"/><circle cx="290" cy="140" r="8"/>
    <circle cx="160" cy="195" r="8"/><circle cx="200" cy="198" r="8"/><circle cx="240" cy="198" r="8"/><circle cx="280" cy="192" r="8"/><circle cx="315" cy="175" r="8"/>
    <circle cx="230" cy="300" r="8"/>
  </g>
  <text class="t" x="360" y="160">10 molecules</text>
  <text class="t" x="360" y="300">1 molecule</text>
  <text x="250" y="25" font-size="18" fill="#1b2a3a" text-anchor="middle">K<tspan font-size="13" baseline-shift="sub">ow</tspan> = C<tspan font-size="13" baseline-shift="sub">octanol</tspan> / C<tspan font-size="13" baseline-shift="sub">water</tspan> = 10;  log K<tspan font-size="13" baseline-shift="sub">ow</tspan> = 1</text>
  <text x="20" y="412" font-size="14" fill="#6b7785">equal volumes, at equilibrium</text>
</svg>
