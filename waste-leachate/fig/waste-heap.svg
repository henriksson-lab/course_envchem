<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Concept: a sulfide waste heap. O2 diffuses in and rain infiltrates; pyrite oxidises in the upper zone; acid, sulfate and metals leave as seepage. Deeper, water-saturated waste stays reduced. -->
  <defs>
    <marker id="ar" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6 L0,12 Z" fill="#1b2a3a"/></marker>
    <marker id="arb" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6 L0,12 Z" fill="#2468A0"/></marker>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,6 L0,12 Z" fill="#c0392b"/></marker>
  </defs>
  <style>
    .t{font-size:17px;fill:#1b2a3a}
    .b{font-size:18px;font-weight:bold;fill:#1b2a3a}
  </style>
  <!-- ground -->
  <rect x="0" y="330" width="940" height="90" fill="#8c7a5b"/>
  <!-- heap -->
  <path d="M80,330 L300,110 L560,110 L780,330 Z" fill="#7b7b7b" stroke="#1b2a3a" stroke-width="2"/>
  <!-- oxidation zone -->
  <path d="M80,330 L300,110 L560,110 L780,330 L720,330 L540,160 L320,160 L140,330 Z" fill="#c8693a" opacity="0.85"/>
  <text x="430" y="143" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">oxidation zone: FeS₂ + O₂ + H₂O</text>
  <text x="430" y="250" font-size="17" fill="#fff" text-anchor="middle">inner waste: little O₂,</text>
  <text x="430" y="272" font-size="17" fill="#fff" text-anchor="middle">pyrite mostly intact</text>
  <!-- pyrite grains -->
  <g fill="#d4b13a" stroke="#6b5a12" stroke-width="1">
    <rect x="380" y="290" width="12" height="12"/><rect x="460" y="300" width="12" height="12"/><rect x="520" y="285" width="12" height="12"/><rect x="330" y="305" width="12" height="12"/>
  </g>
  <!-- O2 -->
  <g stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="210" y1="120" x2="255" y2="170"/><line x1="660" y1="120" x2="615" y2="170"/>
  </g>
  <text class="b" x="140" y="108">O₂ diffuses in</text>
  <text class="b" x="640" y="108">O₂</text>
  <!-- rain -->
  <g stroke="#2468A0" stroke-width="2.5" marker-end="url(#arb)">
    <line x1="380" y1="30" x2="380" y2="100"/><line x1="430" y1="30" x2="430" y2="100"/><line x1="480" y1="30" x2="480" y2="100"/>
  </g>
  <text x="500" y="45" font-size="17" font-weight="bold" fill="#2468A0">rain and snowmelt infiltrate</text>
  <!-- seepage -->
  <path d="M770,335 C810,345 850,350 920,350" stroke="#c0392b" stroke-width="7" fill="none" marker-end="url(#arr)"/>
  <text x="740" y="380" font-size="17" font-weight="bold" fill="#fff">seepage:</text>
  <text x="740" y="402" font-size="16" fill="#fff">H⁺, SO₄²⁻, Fe, Cu, Zn</text>
  <text x="20" y="380" font-size="16" fill="#fff">water table / ground</text>
</svg>
